<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>E-posta Doğrulandı — Sticky Cards</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f8f7ff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #1e1e2c;
      padding: 24px;
      box-sizing: border-box;
    }
    .card {
      background: #ffffff;
      max-width: 420px;
      width: 100%;
      border-radius: 20px;
      padding: 36px 28px;
      text-align: center;
      box-shadow: 0 12px 32px rgba(124, 58, 237, 0.08);
      border: 1px solid #ede9fe;
    }
    .badge {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      background: #ede9fe;
      color: #7c3aed;
    }
    .badge.error { background: #fee2e2; color: #dc2626; }
    h1 { font-size: 22px; margin: 0 0 12px; }
    p { font-size: 15px; line-height: 1.55; color: #636e72; margin: 0 0 20px; }
    .footer { font-size: 12px; color: #9ca3af; margin-top: 24px; }
  </style>
</head>
<body>
  <div class="card">
    <div id="badge" class="badge">✓</div>
    <h1 id="title">E-posta Adresin Doğrulandı!</h1>
    <p id="desc">
      Hesabın hazır. Şimdi <strong>Sticky Cards</strong> uygulamasına dönüp e-posta adresin ve şifrenle giriş yapabilirsin.
    </p>
    <div class="footer">Sticky Cards · Studio Sehzo</div>
  </div>
  <script>
    const hash = window.location.hash || "";
    const search = window.location.search || "";
    if (hash.includes("error=") || search.includes("error=")) {
      document.getElementById("badge").textContent = "!";
      document.getElementById("badge").classList.add("error");
      document.getElementById("title").textContent = "Bağlantının Süresi Dolmuş";
      document.getElementById("desc").textContent =
        "Bu doğrulama bağlantısı geçersiz veya süresi dolmuş. Sticky Cards uygulamasından yeni bir doğrulama e-postası isteyebilirsin.";
    }
  </script>
</body>
</html>
